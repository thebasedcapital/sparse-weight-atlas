[package]
name = "swa-synth"
version = "0.1.0"
edition = "2021"
description = "Zero-LLM predicate synthesis for weight-sparse transformer weights (CONTRACT.md)"

[[bin]]
name = "swa-synth"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
